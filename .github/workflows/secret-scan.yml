name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked runtime data and build outputs
        run: |
          if test -n "$(git log --all --format= --name-only -- data target)"; then
            printf '%s\n' 'Runtime data and build outputs must not appear in Git history.' >&2
            exit 1
          fi
      - name: Scan Git history
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks:v8.30.0
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
